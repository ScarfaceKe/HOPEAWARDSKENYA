# Render blueprint for the full app (Express API + built React SPA).
#
# The site is NOT static: `/api/*` (nominations, voting, payments, admin) only
# exists inside the Express process, and `npm start` serves both the API and the
# built client from one origin, so session cookies and `/api` calls are same-site.
#
# This blueprint deliberately does NOT provision a database. The live data —
# nominees, votes, categories — is in the existing Neon database. Rendering the
# old `databases:` block here would create a brand-new, empty Postgres and the
# site would come up with no nominees. Set DATABASE_URL (with `?sslmode=require`)
# from Neon in the Render dashboard when the service is created.
services:
  - type: web
    name: hopeawardskenya
    runtime: node
    # Free instances sleep after idle and take ~1 minute to wake. A payment
    # callback that arrives while asleep can time out, so upgrade this to
    # `starter` before a live voting window.
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.19.27
      - key: SESSION_SECRET
        generateValue: true
      # Do NOT set MEGAPAY_CALLBACK_SECRET until MegaPay has confirmed they will
      # send it (`x-megapay-signature`) or an approved gateway IP. server/csrf.ts
      # refuses any callback that cannot present the secret once one is set, so a
      # secret MegaPay does not send would silently reject every real payment.
      # If MegaPay can send a header, set the same value here and in their
      # dashboard. If they only publish IPs, set MEGAPAY_CALLBACK_IPS instead.
      # Set in the dashboard: use your own password, not a generated one you
      # then have to hunt for in the logs.
      - key: ADMIN_PASSWORD
        sync: false
      - key: MEGAPAY_API_KEY
        sync: false
      - key: MEGAPAY_EMAIL
        sync: false
      # Paste the existing Neon connection string. Keys with `sync: false` are
      # prompted for at create time and never stored in this file.
      - key: DATABASE_URL
        sync: false

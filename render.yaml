services:
  - type: web
    name: hopeawardskenya
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MEGAPAY_API_KEY
        sync: false
      - key: MEGAPAY_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hopeawards-db
          property: connectionString

databases:
  - name: hopeawards-db
    plan: free
    databaseName: hopeawards
